<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaAzure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>MegaAzure</h1>
      <p>Connecte Microsoft puis lance le transfert.</p>
    </section>

    <section class="card">
      <button id="connectBtn">Se connecter à Microsoft</button>
      <div id="authStatus" class="status">Non connecté</div>

      <div id="deviceBox" class="hidden">
        <p>Va sur le lien et entre ce code :</p>
        <div id="userCode" class="code">-</div>
        <a id="verifyLink" href="#" target="_blank" rel="noopener noreferrer">Ouvrir Microsoft</a>
      </div>

      <input id="megaLink" type="text" placeholder="Lien MEGA">
      <input id="folder" type="text" value="/MEGA Imports" placeholder="Dossier OneDrive">
      <button id="transferBtn">Lancer le transfert</button>
      <div id="transferStatus" class="status">En attente</div>
    </section>

    <section class="card">
      <h2>Résultat</h2>
      <pre id="log">Aucune action pour le moment.</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
